# CI for dsh-freellmapi.
#
# This package has zero runtime dependencies, so `npm install` is only here to keep the
# job shape identical to a normal Node package. The test suite must stay offline: it is
# not allowed to require a running freellmapi gateway, a live network or any API key, so
# that a fork or a pull request can be validated on a clean GitHub runner.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install (no runtime dependencies; kept for consistency)
        run: npm install --no-audit --no-fund

      - name: Test (offline; no live freellmapi gateway required)
        run: npm test
        env:
          # Guards the suite against accidentally reaching a real gateway: nothing in
          # the tests may depend on these being reachable.
          FREELLMAPI_BASE_URL: http://127.0.0.1:3001/v1
          FREELLMAPI_API_KEY: ""
